{% extends 'layout.html' %}

{% block scripts %}
<script src="/js/detail.js" defer></script>
{% endblock %}

{% block content %}
<a href="/reports">← 신고 목록</a>
<section class="panel" id="detail">신고를 불러오는 중…</section>
{% if user.role == 'ADMIN' %}
<section class="panel" aria-labelledby="report-work-title">
    <h2 id="report-work-title">이 신고의 정비 관리</h2>
    <p class="muted" id="report-work-next" hidden></p>
    <form id="report-work-form" class="report-work-form" hidden>
        <label>새 작업의 처리 기한 <input name="dueAt" type="datetime-local" required></label>
        <button type="submit">작업 등록</button>
    </form>
    <a id="report-work-link" href="/work-orders" hidden>이 신고의 작업 배정·검수 →</a>
</section>
{% endif %}
<section class="panel" aria-labelledby="history-title">
    <h2 id="history-title">처리 이력</h2>
    <p class="muted">이력 기능 도입 이후의 변경을 최신순으로 표시합니다.</p>
    <ol id="report-history" class="history-list" aria-live="polite">이력을 불러오는 중…</ol>
    <button id="history-more" class="secondary" hidden>이전 이력 더 보기</button>
</section>
{% endblock %}
