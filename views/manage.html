{% extends 'layout.html' %}

{% block scripts %}
<script src="/js/manage-view.js" defer></script>
<script src="/js/manage-forms.js" defer></script>
<script src="/js/manage-tables.js" defer></script>
<script src="/js/manage.js" defer></script>
{% endblock %}

{% block content %}
<div id="manager" data-page="{{ page }}" data-role="{{ user.role }}">
    <section class="panel">
        <div class="panel-heading">
            <div>
                <h2>{{ title }} 목록</h2>
                <p class="muted">최신 정보를 조회하고 필요한 업무를 처리하세요.</p>
                {% if page == 'workOrders' %}<p class="muted">담당자는 실제 정비 수행자를 기록하는 항목입니다. 배정·진행·완료 기록은 관리자가 입력합니다.</p>{% endif %}
            </div>
            <button id="new-button" hidden>+ 새로 등록</button>
        </div>
        <form id="filters" class="filters"></form>
        <div id="table" class="table-scroll">불러오는 중…</div>
        <div id="pagination" class="pagination"></div>
    </section>
    <section id="editor-panel" class="panel" hidden>
        <div class="panel-heading">
            <h2 id="editor-title">등록</h2>
            <button type="button" id="close-editor" class="secondary">닫기</button>
        </div>
        <form id="editor" class="form-grid"></form>
    </section>
    <section id="related" class="panel" hidden>
        <div class="panel-heading">
            <h2 id="related-title">관련 내역</h2>
            <button id="close-related" class="secondary">닫기</button>
        </div>
        <div id="related-content" class="table-scroll"></div>
    </section>
</div>
{% endblock %}
