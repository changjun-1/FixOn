{% extends 'layout.html' %}{% block scripts %}<script src="/js/auth.js" defer></script>{% endblock %}{% block content %}<section class="auth-card"><h2>FixOn에 오신 것을 환영합니다.</h2><form id="auth-form" data-action="register"><label>아이디 *<input name="id" required minlength="3" maxlength="100" pattern="[A-Za-z0-9_.@-]+" autocomplete="username"><small>영문·숫자·밑줄·점·@·하이픈, 3자 이상</small></label><label>이름 *<input name="name" required maxlength="40" autocomplete="name"></label><label>비밀번호 *<input name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password"><small>8자 이상, UTF-8 기준 72바이트 이하</small></label><button>회원 가입</button></form><p><a href="/login">로그인으로 돌아가기</a></p></section>{% endblock %}
