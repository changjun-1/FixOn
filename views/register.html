{% extends 'layout.html' %}

{% block scripts %}
<script src="/js/auth.js" defer></script>
{% endblock %}

{% block content %}
<div class="auth-brand"><a href="/login" aria-label="FixOn 로그인"><span class="auth-symbol" aria-hidden="true">F<span>↗</span></span><span class="auth-wordmark">FixOn</span></a><p>더 편안한 캠퍼스의 시작</p></div>
<section class="auth-card" aria-labelledby="auth-title">
    <div class="auth-intro"><h1 id="auth-title">함께 시작해요</h1><p class="muted">캠퍼스의 작은 불편을 함께 해결해요.</p></div>
    <form id="auth-form" data-action="register">
        <label>아이디 *
            <input name="id" required minlength="3" maxlength="100" pattern="[A-Za-z0-9_.@-]+" autocomplete="username"><small>영문·숫자·밑줄·점·@·하이픈, 3자 이상</small>
        </label>
        <label>이름 *
            <input name="name" required maxlength="40" autocomplete="name">
        </label>
        <label>비밀번호 *
            <input name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password"><small>8자 이상, UTF-8 기준 72바이트 이하</small>
        </label>
        <button>회원 가입</button>
    </form>
    <p class="auth-switch">
        <a href="/login">로그인으로 돌아가기</a>
    </p>
</section>
{% endblock %}
