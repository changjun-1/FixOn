{% extends 'layout.html' %}

{% block scripts %}
<script src="/js/auth.js" defer></script>
{% endblock %}

{% block content %}
<div class="auth-brand"><a href="/login" aria-label="FixOn 로그인"><span class="auth-symbol" aria-hidden="true">F<span>↗</span></span><span class="auth-wordmark">FixOn</span></a><p>더 편안한 캠퍼스의 시작</p></div>
<section class="auth-card" aria-labelledby="auth-title">
    <div class="auth-intro"><h1 id="auth-title">다시 만나 반가워요</h1>
    <p class="muted">로그인하고 캠퍼스의 일상을 이어가세요.</p></div>
    <form id="auth-form" data-action="login">
        <label>아이디
            <input name="id" required autocomplete="username" maxlength="100" placeholder="아이디를 입력하세요">
        </label>
        <label>비밀번호
            <input name="password" type="password" required autocomplete="current-password" maxlength="72" placeholder="비밀번호를 입력하세요">
        </label>
        <button>로그인 <span aria-hidden="true">→</span></button>
    </form>
    <div class="social-login" aria-label="간편 로그인">
        <div class="auth-divider"><span>또는 간편 로그인</span></div>
        <a class="button social-kakao" href="/auth/kakao"><svg class="provider-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.5 3 2 6.5 2 10.8c0 2.7 1.8 5.1 4.4 6.5L5.3 21l4.4-2.5 2.3.2c5.5 0 10-3.5 10-7.9S17.5 3 12 3Z"/></svg>카카오로 로그인</a>
        <small class="muted">처음 로그인하면 계정이 자동으로 생성됩니다.</small>
    </div>
    <p class="auth-switch">아직 계정이 없으신가요? <a href="/register">회원 가입 <span aria-hidden="true">↗</span></a>
    </p>
</section>
{% endblock %}
